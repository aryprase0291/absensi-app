<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratinjau — Data Absen (kalender + hari libur)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  @keyframes panelNaik{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>
<body class="bg-slate-200 p-6">

<div class="max-w-6xl mx-auto">
  <h1 class="text-xl font-semibold text-slate-900 tracking-tight">Pratinjau — Data Absen</h1>
  <p class="text-sm text-slate-500 mt-1 mb-5">Ketuk tanggal berwarna <em>atau tanggal merah</em> untuk membuka panelnya. Halaman ini mengambil daftar libur dari sumber yang sama dengan aplikasi — hasilnya di kotak kanan.</p>

  <div class="grid lg:grid-cols-2 gap-6">
    <div>
      <div class="bg-slate-50 rounded-3xl shadow-xl overflow-hidden relative" style="width:100%;max-width:430px;height:880px">
        <div id="layar" class="h-full overflow-y-auto p-4"></div>
        <div id="panel"></div>
      </div>
    </div>

    <div class="space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <p class="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-2">Uji sumber hari libur</p>
        <div id="uji" class="text-[12.5px] text-slate-600">Mengambil…</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <p class="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-2">Arti warna</p>
        <div class="text-[12px] text-slate-600 space-y-1.5" id="legenda"></div>
      </div>
    </div>
  </div>
</div>

<script>
const I=(n,c)=>`<i data-lucide="${n}" class="${c}"></i>`;
const SUMBER='https://raw.githubusercontent.com/guangrei/APIHariLibur_V2/main/calendar.min.json';

const GAYA={
  H:{dot:'bg-emerald-500',tint:'bg-emerald-50',teks:'text-emerald-700'},
  T:{dot:'bg-amber-500',tint:'bg-amber-50',teks:'text-amber-700'},
  TSi:{dot:'bg-orange-500',tint:'bg-orange-50',teks:'text-orange-700'},
  Si:{dot:'bg-rose-500',tint:'bg-rose-50',teks:'text-rose-700'},
  So:{dot:'bg-rose-500',tint:'bg-rose-50',teks:'text-rose-700'},
  A:{dot:'bg-red-600',tint:'bg-red-50',teks:'text-red-700'},
  I:{dot:'bg-blue-500',tint:'bg-blue-50',teks:'text-blue-700'},
  S:{dot:'bg-violet-500',tint:'bg-violet-50',teks:'text-violet-700'},
  C:{dot:'bg-teal-500',tint:'bg-teal-50',teks:'text-teal-700'},
  CB:{dot:'bg-teal-500',tint:'bg-teal-50',teks:'text-teal-700'},
  DL:{dot:'bg-sky-500',tint:'bg-sky-50',teks:'text-sky-700'},
  O:{dot:'bg-slate-300',tint:'bg-slate-50',teks:'text-slate-400'},
};
const gaya=s=>GAYA[s]||{dot:'bg-slate-400',tint:'bg-slate-100',teks:'text-slate-600'};
const KET={H:'Hadir',T:'Terlambat',O:'Off / Libur',CB:'Cuti Bersama',Si:'Tdk Absen IN',So:'Tdk Absen OUT',I:'Ijin',S:'Sakit',C:'Cuti',A:'Alpa',DL:'Dinas Luar',TSi:'Telat & No Scan In'};
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];

// Data absensi contoh (Agustus 2026)
const DATA={};
const isi=(t,sym,masuk,pulang,telat)=>DATA[`2026-08-${String(t).padStart(2,'0')}`]={t,sym,masuk,pulang,telat,jamKerja:'08:30-17:00',scan:'08:52, 12:01, 13:00, 17:01'};
[[3,'H','08:12','17:04'],[4,'H','08:20','17:00'],[5,'T','08:41','17:02','00:11'],[6,'H','08:05','17:10'],[7,'H','08:18','17:00'],
 [8,'O','-','-'],[9,'O','-','-'],
 [10,'H','08:22','17:03'],[11,'S','-','-'],[12,'H','08:23','17:02'],[13,'H','08:09','17:00'],[14,'T','08:52','17:01','00:22'],
 [15,'O','-','-'],[16,'O','-','-'],
 [18,'H','08:11','17:05'],[19,'So','08:14','-'],[20,'I','-','-'],[21,'H','08:26','17:00'],
 [22,'O','-','-'],[23,'O','-','-'],
 [24,'DL','-','-'],[25,'H','08:03','17:12'],[26,'TSi','-','17:03','00:15'],[27,'A','-','-'],[28,'H','08:17','17:01'],
 [29,'O','-','-'],[30,'O','-','-'],[31,'H','08:08','17:00']
].forEach(a=>isi(...a));

let LIBUR={};
let dipilih=null;
let filterGrup='All';

const GRUP={
  GRUP_HADIR:{label:'Hadir',kode:['H','T','TPC','PC','TSi','TSo','Si','So','SiSo','SiPC'],warna:'text-slate-900',aktif:'bg-slate-900 text-white'},
  GRUP_TELAT:{label:'Telat',kode:['T','TPC','TSi','TSo','SiPC'],warna:'text-amber-600',aktif:'bg-amber-500 text-white'},
  GRUP_PERLU:{label:'Perlu cek',kode:['Si','So','SiSo','A','AC','NF'],warna:'text-rose-600',aktif:'bg-rose-600 text-white'},
  GRUP_IZIN:{label:'Izin/cuti',kode:['I','S','C','CB','DL','EO'],warna:'text-slate-900',aktif:'bg-teal-600 text-white'},
};
const lolos=it=>filterGrup==='All'||GRUP[filterGrup].kode.includes(it.sym);
function klikRingkas(g){ dipilih=null; document.getElementById('panel').innerHTML=''; filterGrup=(filterGrup===g?'All':g); gambarLayar(); }
function lepasSaring(){ filterGrup='All'; gambarLayar(); }

function kunciNav(){ return [...new Set([...Object.keys(DATA).filter(k=>lolos(DATA[k])),...Object.keys(LIBUR).filter(k=>k.startsWith('2026-08'))])].sort(); }

function ringkas(){
  const r={}; Object.keys(GRUP).forEach(g=>r[g]=0);
  Object.values(DATA).forEach(it=>Object.keys(GRUP).forEach(g=>{ if(GRUP[g].kode.includes(it.sym)) r[g]++; }));
  return r;
}

function gambarLayar(){
  const awal=(new Date(2026,7,1).getDay()+6)%7, jml=31;
  let sel='';
  for(let i=0;i<awal;i++) sel+='<div></div>';
  for(let t=1;t<=jml;t++){
    const k=`2026-08-${String(t).padStart(2,'0')}`, itAll=DATA[k], it=(itAll&&lolos(itAll))?itAll:null, g=it?gaya(it.sym):null;
    const lib=LIBUR[k], minggu=new Date(2026,7,t).getDay()===0, dip=dipilih===k, ada=!!(it||lib);
    sel+=`<button ${ada?`onclick="pilih('${k}')"`:'disabled'} class="relative aspect-square rounded-xl flex flex-col items-center justify-center transition-all ${it?g.tint+' active:scale-90 cursor-pointer':''} ${!it&&lib?'bg-rose-50/70 active:scale-90 cursor-pointer':''} ${dip?'ring-2 ring-slate-900 ring-offset-1':''}">
      <span class="text-[13px] font-semibold tabular-nums leading-none ${it?g.teks:(lib||minggu)?'text-rose-500':'text-slate-300'}">${t}</span>
      ${it?`<span class="mt-1 w-1.5 h-1.5 rounded-full ${g.dot}"></span>`:'<span class="mt-1 w-1.5 h-1.5"></span>'}
      ${lib?'<span class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-rose-500 ring-2 ring-white"></span>':''}
      ${t===14?'<span class="absolute bottom-1 w-3 h-[2px] rounded-full bg-slate-900/70"></span>':''}
    </button>`;
  }

  const r=ringkas();
  const stat=Object.keys(GRUP).map(g=>{
    const grup=GRUP[g], n=r[g], aktif=filterGrup===g, bisa=n>0;
    return `<button ${bisa?`onclick="klikRingkas('${g}')"`:'disabled'} class="px-2 py-3 text-center transition-colors ${aktif?grup.aktif:bisa?'hover:bg-slate-50':'cursor-default'}">
      <p class="text-[19px] leading-none font-semibold tabular-nums tracking-tight ${aktif?'text-white':bisa?grup.warna:'text-slate-300'}">${n}</p>
      <p class="mt-1 text-[10px] leading-tight ${aktif?'text-white/80':'text-slate-400'}">${grup.label}</p></button>`;
  }).join('');

  const liburAgs=Object.keys(LIBUR).filter(k=>k.startsWith('2026-08')).sort()
    .map(k=>({tgl:Number(k.slice(8)),...LIBUR[k]}));

  const simbol=[...new Set(Object.values(DATA).filter(lolos).map(d=>d.sym))].sort();

  document.getElementById('layar').innerHTML=`
    <div class="flex items-start justify-between gap-3 mb-4">
      <div class="min-w-0">
        <p class="text-[10px] font-semibold uppercase tracking-[0.13em] text-slate-400 leading-none">Presensi mesin</p>
        <h2 class="mt-1.5 text-[20px] font-semibold text-slate-900 tracking-tight leading-none">Data Absen</h2>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span class="relative w-9 h-9 rounded-xl border bg-white text-slate-600 border-slate-200 flex items-center justify-center">${I('filter','w-[17px] h-[17px]')}</span>
        <span class="w-9 h-9 rounded-xl border bg-white text-slate-600 border-slate-200 flex items-center justify-center">${I('chevron-left','w-[17px] h-[17px]')}</span>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-1.5 mb-4">
      <span class="inline-flex items-center gap-1.5 bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-[10.5px] font-medium text-slate-600">${I('fingerprint','w-3 h-3 text-slate-400')}<span class="font-mono">G0268</span></span>
      <span class="inline-flex items-center gap-1.5 bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-[10.5px] font-medium text-slate-600">${I('clock','w-3 h-3 text-slate-400')}1 jam 30 menit yang lalu</span>
      ${Object.keys(LIBUR).length?'<span class="inline-flex items-center gap-1.5 bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-[10.5px] font-medium text-slate-600"><span class="w-2 h-2 rounded-full bg-rose-500"></span>Libur nasional aktif</span>':''}
    </div>

    <div class="mb-4 grid grid-cols-2 gap-1 bg-slate-200/60 rounded-xl p-1">
      <button class="flex items-center justify-center gap-1.5 py-2 rounded-lg text-[12px] font-semibold bg-white text-slate-900 shadow-sm">${I('calendar-days','w-[15px] h-[15px]')} Kalender</button>
      <button class="flex items-center justify-center gap-1.5 py-2 rounded-lg text-[12px] font-semibold text-slate-500">${I('list','w-[15px] h-[15px]')} Daftar</button>
    </div>

    <div class="space-y-3">
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="flex items-center justify-between px-3 py-3 border-b border-slate-100">
          <span class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400">${I('chevron-left','w-[18px] h-[18px]')}</span>
          <div class="text-center">
            <p class="text-[14px] font-semibold text-slate-900 tracking-tight leading-none">${BULAN[7]} 2026</p>
            <p class="text-[10px] text-slate-400 mt-1 tabular-nums">${Object.values(DATA).filter(lolos).length} hari tercatat</p>
          </div>
          <span class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400">${I('chevron-right','w-[18px] h-[18px]')}</span>
        </div>
        <div class="grid grid-cols-7 px-2 pt-2.5">
          ${HARI.map((h,i)=>`<div class="text-center text-[10px] font-semibold uppercase tracking-wide ${i===6?'text-rose-300':'text-slate-300'}">${h}</div>`).join('')}
        </div>
        <div class="grid grid-cols-7 gap-1 p-2">${sel}</div>
        <div class="grid grid-cols-4 divide-x divide-slate-100 border-t border-slate-100">${stat}</div>
        ${GRUP[filterGrup]?`<button onclick="lepasSaring()" class="w-full flex items-center justify-center gap-1.5 py-2.5 border-t border-slate-100 bg-slate-50 text-[11px] font-medium text-slate-500 hover:bg-slate-100">
          ${I('x','w-3 h-3')} Hanya menampilkan ${GRUP[filterGrup].label.toLowerCase()} — ketuk untuk melepas</button>`:''}
      </div>

      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm px-4 py-3">
        <p class="text-[10px] font-semibold uppercase tracking-[0.09em] text-slate-400 mb-2">Keterangan</p>
        <div class="flex flex-wrap gap-x-4 gap-y-1.5">
          ${simbol.map(s=>`<span class="inline-flex items-center gap-1.5 text-[11px] text-slate-600"><span class="w-2 h-2 rounded-full ${gaya(s).dot}"></span>${KET[s]||s}</span>`).join('')}
        </div>
      </div>

      ${liburAgs.length?`<div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <header class="flex items-center gap-2.5 px-4 py-3 border-b border-slate-100">
          <span class="w-8 h-8 shrink-0 rounded-[10px] bg-rose-50 text-rose-600 flex items-center justify-center">${I('calendar-days','w-[15px] h-[15px]')}</span>
          <div class="flex-1 min-w-0"><p class="text-[13px] font-semibold text-slate-900 tracking-tight leading-tight">Libur nasional</p>
          <p class="text-[10.5px] text-slate-400 leading-tight mt-0.5">${liburAgs.length} hari di bulan ini</p></div>
        </header>
        <div class="divide-y divide-slate-100">
          ${liburAgs.map(h=>`<button onclick="pilih('2026-08-${String(h.tgl).padStart(2,'0')}')" class="w-full flex items-center gap-3 px-4 py-2.5 text-left hover:bg-slate-50">
            <span class="w-8 shrink-0 text-[15px] font-semibold text-rose-500 tabular-nums text-center">${h.tgl}</span>
            <span class="flex-1 min-w-0 text-[12.5px] text-slate-700 leading-snug">${h.nama}</span>
          </button>`).join('')}
        </div></div>`:''}
    </div>
    <div class="h-10"></div>`;
  lucide.createIcons();
}

function pilih(k){ dipilih=k; gambarLayar(); gambarPanel(); }
function tutup(){ dipilih=null; gambarLayar(); document.getElementById('panel').innerHTML=''; }

function gambarPanel(){
  const itAll=DATA[dipilih], it=(itAll&&lolos(itAll))?itAll:null, lib=LIBUR[dipilih];
  if(!it&&!lib){document.getElementById('panel').innerHTML='';return;}
  const g=it?gaya(it.sym):null, K=kunciNav(), idx=K.indexOf(dipilih);
  const d=new Date(dipilih+'T00:00:00');
  const tgl=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const ajukan=it&&['T','TSi','TSo','Si','So'].includes(it.sym);

  document.getElementById('panel').innerHTML=`
  <div class="absolute inset-0 z-[110] flex items-end justify-center">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px]" onclick="tutup()"></div>
    <div class="relative w-full bg-white rounded-t-3xl shadow-2xl max-h-[88%] overflow-y-auto" style="animation:panelNaik .26s cubic-bezier(.22,1,.36,1)">
      <div class="sticky top-0 bg-white/95 backdrop-blur-sm px-4 pt-3 pb-3 border-b border-slate-100 z-10">
        <div class="w-9 h-1 rounded-full bg-slate-200 mx-auto mb-3"></div>
        <div class="flex items-center justify-between gap-2">
          <button ${idx<=0?'disabled':`onclick="pilih('${K[idx-1]}')"`} class="w-8 h-8 shrink-0 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 disabled:opacity-25">${I('chevron-left','w-[18px] h-[18px]')}</button>
          <div class="text-center min-w-0">
            <p class="text-[14px] font-semibold text-slate-900 tracking-tight leading-tight truncate">${tgl}</p>
            <div class="flex flex-wrap items-center justify-center gap-1 mt-1">
              ${it?`<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-lg text-[10.5px] font-semibold ${g.tint} ${g.teks}"><span class="w-1.5 h-1.5 rounded-full ${g.dot}"></span>${KET[it.sym]||it.sym}</span>`:''}
              ${lib?'<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-lg text-[10.5px] font-semibold bg-rose-50 text-rose-600"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>Libur nasional</span>':''}
            </div>
          </div>
          <button ${idx>=K.length-1?'disabled':`onclick="pilih('${K[idx+1]}')"`} class="w-8 h-8 shrink-0 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 disabled:opacity-25">${I('chevron-right','w-[18px] h-[18px]')}</button>
        </div>
      </div>

      <div class="p-4 space-y-3">
        ${lib?`<div class="rounded-2xl bg-rose-50 border border-rose-100 px-4 py-3">
          <p class="text-[13px] font-semibold text-rose-900 leading-snug">${lib.nama}</p>
          <p class="text-[10.5px] text-rose-700/80 mt-0.5">Hari libur nasional</p></div>`:''}

        ${!it?`<div class="rounded-2xl border border-dashed border-slate-200 px-4 py-6 text-center">
          ${I('fingerprint','w-6 h-6 text-slate-300 mx-auto mb-2')}
          <p class="text-[12.5px] font-medium text-slate-500">Tidak ada catatan mesin</p>
          <p class="text-[10.5px] text-slate-400 mt-0.5">Wajar untuk tanggal merah</p></div>`:`
        <div class="grid grid-cols-2 gap-2.5">
          <div class="rounded-2xl border border-slate-200/80 p-3.5">
            <div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span class="text-[10.5px] font-medium text-slate-500">Masuk</span></div>
            <p class="mt-2 text-[26px] leading-none font-semibold text-slate-900 tabular-nums tracking-tight">${it.masuk}</p></div>
          <div class="rounded-2xl border border-slate-200/80 p-3.5">
            <div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span><span class="text-[10.5px] font-medium text-slate-500">Pulang</span></div>
            <p class="mt-2 text-[26px] leading-none font-semibold text-slate-900 tabular-nums tracking-tight">${it.pulang}</p></div>
        </div>
        <div class="rounded-2xl border border-slate-200/80 divide-y divide-slate-100">
          <div class="flex items-center justify-between px-4 py-2.5"><span class="text-[11.5px] text-slate-500">Jam kerja</span><span class="text-[12.5px] font-semibold text-slate-900 tabular-nums">${it.jamKerja}</span></div>
          ${it.telat?`<div class="flex items-center justify-between px-4 py-2.5"><span class="text-[11.5px] text-slate-500">Terlambat</span><span class="text-[12.5px] font-semibold text-amber-600 tabular-nums">${it.telat}</span></div>`:''}
          <div class="flex items-center justify-between px-4 py-2.5"><span class="text-[11.5px] text-slate-500">Kode</span><span class="text-[12.5px] font-semibold text-slate-900 font-mono">${it.sym}</span></div>
          <div class="px-4 py-2.5"><p class="text-[11.5px] text-slate-500 mb-1">Waktu scan mesin</p><p class="text-[11px] font-mono text-slate-700 leading-relaxed">${it.scan}</p></div>
        </div>`}

        ${ajukan?`<button class="w-full flex items-center justify-center gap-2 py-3 rounded-2xl text-[13px] font-semibold border bg-amber-50 text-amber-700 border-amber-200">${I('file-text','w-4 h-4')} Ajukan Form Ijin</button>`:''}
        <button onclick="tutup()" class="w-full py-3 rounded-2xl bg-slate-100 text-[13px] font-semibold text-slate-700">Tutup</button>
      </div>
    </div>
  </div>`;
  lucide.createIcons();
}

document.getElementById('legenda').innerHTML =
  [['bg-emerald-500','Hadir normal'],['bg-amber-500','Telat / pulang cepat — tetap hadir'],['bg-orange-500','Telat + ada scan yang hilang'],
   ['bg-rose-500','Scan masuk atau pulang tidak terekam'],['bg-red-600','Alpa'],['bg-blue-500','Ijin'],['bg-violet-500','Sakit'],
   ['bg-teal-500','Cuti / cuti bersama'],['bg-sky-500','Dinas luar'],['bg-slate-300','Off / libur mingguan'],
   ['bg-rose-500 ring-2 ring-white','Titik pojok kanan atas = libur nasional']]
  .map(([w,t])=>`<div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full ${w} shrink-0"></span>${t}</div>`).join('');

gambarLayar();

// --- Uji sumber hari libur, persis seperti yang dilakukan aplikasi ---
(async () => {
  const kotak = document.getElementById('uji');
  try {
    const t0 = performance.now();
    const res = await fetch(SUMBER);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const mentah = await res.json();
    const ms = Math.round(performance.now() - t0);

    Object.keys(mentah).forEach(k => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const e = mentah[k];
      if (!e || e.holiday !== true) return;
      const nama = Array.isArray(e.summary) ? e.summary.join(', ') : String(e.summary || '');
      LIBUR[k] = { nama: nama.replace(/\s*\(belum pasti\)/i, '').trim(), pasti: !/belum pasti/i.test(nama) };
    });

    const daftar = Object.keys(LIBUR).sort();
    kotak.innerHTML = `<p class="text-emerald-700 font-semibold mb-2">✓ Berhasil — CORS lolos, ${ms} ms, ${daftar.length} hari libur.</p>
      <div class="max-h-72 overflow-y-auto space-y-0.5 text-[11.5px]">
        ${daftar.map(k=>`<div class="flex gap-2"><span class="font-mono text-slate-400 shrink-0">${k}</span><span>${LIBUR[k].nama}</span></div>`).join('')}
      </div>`;
    gambarLayar();
  } catch (e) {
    kotak.innerHTML = `<p class="text-rose-700 font-semibold">✗ Gagal: ${e.message}</p>
      <p class="text-slate-500 mt-1 text-[11.5px]">Di aplikasi, kegagalan ini tidak menghentikan apa pun — kalender absensi tetap jalan, hanya penanda tanggal merahnya yang tidak muncul.</p>`;
  }
})();
</script>
</body>
</html>
