<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratinjau — Dashboard absensi-app</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  @keyframes notifNaik { 0% { opacity:0; transform: translateY(12px) scale(.97);} 100%{opacity:1;transform:none;} }
</style>
</head>
<body class="bg-slate-100 p-5">

<div class="max-w-5xl mx-auto">
  <h1 class="text-xl font-semibold text-slate-900 tracking-tight">Pratinjau tampilan baru</h1>
  <p class="text-sm text-slate-500 mt-1 mb-6">Halaman statis untuk memeriksa desain — bukan aplikasi sungguhan. Tiga keadaan kartu absen ditampilkan berdampingan.</p>

  <div class="grid md:grid-cols-3 gap-5" id="kolom"></div>

  <h2 class="text-lg font-semibold text-slate-900 tracking-tight mt-10 mb-3">Notifikasi import</h2>
  <div class="grid md:grid-cols-3 gap-5" id="notif"></div>
</div>

<script>
const IKON = (n, cls) => `<i data-lucide="${n}" class="${cls}"></i>`;

function kartuAbsen({label, jam, ikon, keadaan, warna}) {
  const selesai = keadaan === 'selesai', utama = keadaan === 'utama';
  const gaya = selesai ? `bg-white border-slate-200/80 ${warna.teksSelesai}`
             : utama   ? `${warna.isi} border-transparent text-white ${warna.bayangan}`
                       : 'bg-white border-slate-200/80 text-slate-400';
  return `
  <button class="relative flex-1 min-w-0 rounded-2xl border p-3.5 text-left transition-all duration-200 active:scale-[0.97] ${gaya}">
    <div class="flex items-center gap-2">
      <span class="w-7 h-7 shrink-0 rounded-lg flex items-center justify-center ${selesai ? warna.lembut : utama ? 'bg-white/20' : 'bg-slate-100'}">
        ${IKON(ikon, 'w-[15px] h-[15px]')}
      </span>
      <span class="text-[11px] font-semibold tracking-tight truncate ${utama ? 'text-white/90' : selesai ? 'text-slate-500' : 'text-slate-400'}">${label}</span>
    </div>
    <p class="mt-2.5 font-semibold tabular-nums tracking-tight leading-none text-[26px] ${jam ? '' : 'opacity-40'}">${jam || '--:--'}</p>
    <p class="mt-1.5 text-[10px] font-medium leading-tight ${utama ? 'text-white/70' : selesai ? warna.teksSelesai : 'text-slate-300'}">
      ${selesai ? 'Sudah tercatat' : utama ? 'Ketuk untuk absen' : 'Belum tercatat'}
    </p>
    ${selesai ? `<span class="absolute top-3 right-3 ${warna.teksSelesai}">${IKON('check-circle','w-4 h-4')}</span>` : ''}
  </button>`;
}

const HIJAU = { isi:'bg-emerald-600', bayangan:'shadow-lg shadow-emerald-600/20', lembut:'bg-emerald-50', teksSelesai:'text-emerald-600' };
const MERAH = { isi:'bg-rose-600',    bayangan:'shadow-lg shadow-rose-600/20',    lembut:'bg-rose-50',    teksSelesai:'text-rose-600' };

function blok(judul, masuk, pulang, footer) {
  return `
  <div>
    <p class="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-2">${judul}</p>
    <div class="bg-gray-50 p-4 rounded-3xl">

      <div class="mb-4 bg-white rounded-2xl border border-slate-200/70 overflow-hidden">
        <div class="flex items-center justify-between px-4 pt-3.5 pb-1">
          <h3 class="text-[13px] font-semibold text-slate-900 tracking-tight">Absensi hari ini</h3>
          <span class="flex items-center gap-1.5 text-[11px] font-medium text-slate-400 tabular-nums">${IKON('clock','w-3 h-3')} 14:27</span>
        </div>
        <div class="flex gap-2.5 p-3 pt-2">
          ${kartuAbsen({label:'Absen Masuk', jam:masuk.jam, ikon:'log-in', keadaan:masuk.keadaan, warna:HIJAU})}
          ${kartuAbsen({label:'Absen Pulang', jam:pulang.jam, ikon:'log-out', keadaan:pulang.keadaan, warna:MERAH})}
        </div>
        ${footer ? `<div class="border-t border-slate-100 bg-slate-50/70 px-4 py-2 flex items-center gap-1.5">
          ${IKON('timer','w-3 h-3 text-slate-400')}
          <span class="text-[10.5px] font-medium text-slate-500">${footer}</span>
        </div>` : ''}
      </div>

      <div class="mb-5 bg-white rounded-2xl border border-slate-200/70 overflow-hidden">
        <div class="grid grid-cols-5 divide-x divide-slate-100">
          ${[['history','Riwayat'],['fingerprint','Data mesin'],['message-square-text','Respon'],['users-round','Approval'],['sliders-horizontal','Panel']]
            .map(([i,t])=>`<div class="flex flex-col items-center gap-1.5 px-1 py-3.5">
              ${IKON(i,'w-[18px] h-[18px] text-slate-500')}
              <span class="text-[10.5px] font-medium text-slate-600 leading-tight text-center">${t}</span></div>`).join('')}
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200/70 overflow-hidden opacity-60">
        <div class="grid grid-cols-2 divide-x divide-slate-100">
          <div class="p-4"><span class="text-[11px] font-medium text-slate-500">Hadir</span>
            <p class="mt-2 text-[32px] leading-none font-semibold tabular-nums tracking-tighter text-slate-900">18</p></div>
          <div class="p-4"><span class="text-[11px] font-medium text-slate-500">Telat</span>
            <p class="mt-2 text-[32px] leading-none font-semibold tabular-nums tracking-tighter text-slate-900">3</p></div>
        </div>
        <p class="text-center text-[10px] text-slate-400 py-2 border-t border-slate-100">…kartu Statistik (sekarang di bawah menu)</p>
      </div>

    </div>
  </div>`;
}

document.getElementById('kolom').innerHTML =
    blok('1 — Belum absen sama sekali', {jam:'', keadaan:'utama'},   {jam:'', keadaan:'menunggu'}, '')
  + blok('2 — Sudah masuk, belum pulang', {jam:'08:03', keadaan:'selesai'}, {jam:'', keadaan:'utama'},
         'Masuk pukul <span class="font-semibold text-slate-700 tabular-nums">08:03</span> — belum absen pulang')
  + blok('3 — Sudah lengkap', {jam:'08:03', keadaan:'selesai'}, {jam:'17:12', keadaan:'selesai'},
         'Durasi kerja hari ini <span class="font-semibold text-slate-700 tabular-nums">9 jam 9 menit</span>');

document.getElementById('notif').innerHTML = `
  <div>
    <p class="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-2">Sedang berjalan</p>
    <div class="bg-slate-900 text-white rounded-2xl shadow-2xl px-4 py-3 flex items-center gap-3">
      ${IKON('loader-2','w-5 h-5 text-blue-300 animate-spin')}
      <div class="min-w-0 flex-1">
        <p class="text-[12px] font-semibold leading-tight">Mengimpor data mesin… 27%</p>
        <div class="mt-1.5 h-1 rounded-full bg-white/15 overflow-hidden"><div class="h-full rounded-full bg-blue-400" style="width:27%"></div></div>
        <p class="mt-1 text-[10px] text-slate-400 tabular-nums">5/18 bagian · 6.920 baris · jangan tutup halaman ini</p>
      </div>
    </div>
  </div>

  <div>
    <p class="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-2">Berhasil</p>
    <div class="bg-white rounded-2xl shadow-2xl border border-emerald-200 overflow-hidden" style="animation:notifNaik .28s cubic-bezier(.22,1,.36,1)">
      <div class="p-4 flex gap-3">
        <span class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center bg-emerald-50 text-emerald-600">${IKON('check-circle','w-5 h-5')}</span>
        <div class="min-w-0 flex-1">
          <p class="text-[13px] font-semibold text-slate-900 leading-tight">Import dbabsen selesai</p>
          <p class="mt-0.5 text-[11px] text-slate-500">6.920 baris dari 3 file terkirim.</p>
          <ul class="mt-2 space-y-0.5 text-[11px] text-slate-500 tabular-nums">
            <li>Baris dari file: <span class="font-semibold text-slate-700">6.920</span></li>
            <li>Baris lama ditimpa: <span class="font-semibold text-slate-700">1.240</span></li>
            <li>Baris lama dipertahankan: <span class="font-semibold text-slate-700">5.460</span></li>
            <li class="pt-0.5 flex items-center gap-1.5 text-slate-700 font-semibold">${IKON('database','w-3 h-3 text-slate-400')} Total dbabsen sekarang: 12.380</li>
          </ul>
        </div>
        <span class="shrink-0 text-slate-300 -mt-1 -mr-1 p-1">${IKON('x','w-4 h-4')}</span>
      </div>
    </div>
  </div>

  <div>
    <p class="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mb-2">Gagal</p>
    <div class="bg-white rounded-2xl shadow-2xl border border-red-200 overflow-hidden">
      <div class="p-4 flex gap-3">
        <span class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center bg-red-50 text-red-600">${IKON('alert-triangle','w-5 h-5')}</span>
        <div class="min-w-0 flex-1">
          <p class="text-[13px] font-semibold text-red-700 leading-tight">Import dbabsen gagal</p>
          <p class="mt-0.5 text-[11px] text-slate-500 leading-relaxed">Server Google membalas halaman, bukan data. Sheet dbabsen belum tersentuh, aman untuk diulang dari awal.</p>
        </div>
        <span class="shrink-0 text-slate-300 -mt-1 -mr-1 p-1">${IKON('x','w-4 h-4')}</span>
      </div>
    </div>
  </div>`;

lucide.createIcons();
</script>
</body>
</html>
